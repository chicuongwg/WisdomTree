openapi: 3.1.0
info:
  title: WisdomTree V1 API
  version: 0.1.0
  description: >
    API contract derived from docs/system/integration-contracts.md. Conventions:
    all routes require an authenticated session (Google OIDC cookie) except
    /calendar/{token}.ics; authorization follows docs/design/authorization-design.md;
    mutating requests on version-locked resources carry expectedVersion and
    receive 409 on a stale version; all errors use the Error schema.
servers:
  - url: /api
security:
  - sessionCookie: []

paths:
  # --- Auth and Session ---
  /session:
    get:
      summary: Current session and role/space claims
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {$ref: "#/components/schemas/Session"}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /auth/logout:
    post:
      summary: End session
      responses:
        "204": {description: Logged out}

  # --- Spaces ---
  /spaces:
    get:
      summary: List spaces visible to the caller (members see own spaces; Admin/Op sees all)
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Space"}}}}
    post:
      summary: Create a space (Admin/Op)
      requestBody: {$ref: "#/components/requestBodies/SpaceCreate"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Space"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /spaces/{spaceId}:
    parameters: [{$ref: "#/components/parameters/spaceId"}]
    patch:
      summary: Update space metadata (Admin/Op)
      requestBody: {$ref: "#/components/requestBodies/SpaceUpdate"}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Space"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /spaces/{spaceId}/members:
    parameters: [{$ref: "#/components/parameters/spaceId"}]
    post:
      summary: Add a member (Admin/Op)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [userId], properties: {userId: {type: string, format: uuid}}}}}
      responses:
        "201": {description: Added}
        "403": {$ref: "#/components/responses/Forbidden"}
  /spaces/{spaceId}/members/{userId}:
    parameters:
      - {$ref: "#/components/parameters/spaceId"}
      - {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      summary: Remove a member (Admin/Op)
      responses:
        "204": {description: Removed}

  # --- Source Repo: intake and storage ---
  /source/upload:
    post:
      summary: Upload a new source file into a member space (store-first; returns once stored)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, spaceId, title]
              properties:
                file: {type: string, format: binary, description: "Bounded by intake-constraints (100 MB, allowed formats)"}
                spaceId: {type: string, format: uuid}
                title: {type: string}
                description: {type: string}
      responses:
        "201": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/Source"}}}}
        "413": {description: File exceeds intake size limit, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
        "415": {description: Format not in the intake allow-list, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /source/{sourceId}/version:
    parameters: [{$ref: "#/components/parameters/sourceId"}]
    post:
      summary: Upload a new version of an existing source
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {type: object, required: [file], properties: {file: {type: string, format: binary}}}
      responses:
        "201": {description: Stored, content: {application/json: {schema: {$ref: "#/components/schemas/SourceVersion"}}}}
  /source/gap-request:
    post:
      summary: Create a branch-gap request (non-file intake)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [title], properties: {title: {type: string}, description: {type: string}}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/GapRequest"}}}}
  /library:
    get:
      summary: Browse stored items across the caller's member spaces (store-first Library)
      parameters:
        - {name: spaceId, in: query, schema: {type: string, format: uuid}}
        - {name: q, in: query, schema: {type: string}, description: Title/metadata and full-text query}
        - {$ref: "#/components/parameters/page"}
      responses:
        "200":
          description: Space-scoped result list
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/LibraryItem"}}}}
  /source/my-submissions:
    get:
      summary: Unified intake history (sources and gap requests) for the caller
      responses:
        "200":
          description: OK
          content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/IntakeItem"}}}}
  /source/{sourceId}:
    parameters: [{$ref: "#/components/parameters/sourceId"}]
    get:
      summary: Source detail (member view is space-scoped; review internals are Admin/Op)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/Source"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
  /source/{sourceId}/download:
    parameters: [{$ref: "#/components/parameters/sourceId"}]
    get:
      summary: Download the original file (space members and Admin/Op; served via short-lived signed URL redirect)
      responses:
        "302": {description: Redirect to time-limited object-storage URL}
        "403": {$ref: "#/components/responses/Forbidden"}
  /source/gap-request/{requestId}:
    parameters: [{$ref: "#/components/parameters/requestId"}]
    get:
      summary: Gap request detail
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/GapRequest"}}}}
  /source/{sourceId}/version/{versionId}:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    get:
      summary: Source version detail including extraction status and text chunk references
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/SourceVersion"}}}}

  # --- Source Repo: gap triage (Admin/Op) ---
  /source/gap-request/{requestId}/triage:
    parameters: [{$ref: "#/components/parameters/requestId"}]
    post:
      summary: Mark a gap request triaged
      responses: {"200": {description: Triaged, content: {application/json: {schema: {$ref: "#/components/schemas/GapRequest"}}}}}
  /source/gap-request/{requestId}/convert:
    parameters: [{$ref: "#/components/parameters/requestId"}]
    post:
      summary: Convert a triaged gap request into branch or node work
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {branchId: {type: string, format: uuid}, nodeId: {type: string, format: uuid}}}}}
      responses: {"200": {description: Converted, content: {application/json: {schema: {$ref: "#/components/schemas/GapRequest"}}}}}
  /source/gap-request/{requestId}/reject:
    parameters: [{$ref: "#/components/parameters/requestId"}]
    post:
      summary: Reject a gap request
      responses: {"200": {description: Rejected}}
  /source/gap-request/{requestId}/archive:
    parameters: [{$ref: "#/components/parameters/requestId"}]
    post:
      summary: Archive a gap request
      responses: {"200": {description: Archived}}

  # --- Source Repo: curation ---
  /source/{sourceId}/version/{versionId}/assign:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    post:
      summary: Assign curation work to an editor (Admin/Op; opens curation as under_correction)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [assigneeId], properties: {assigneeId: {type: string, format: uuid}}}}}
      responses: {"200": {description: Assigned, content: {application/json: {schema: {$ref: "#/components/schemas/Curation"}}}}}
  /source/{sourceId}/version/{versionId}/corrected-text:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    post:
      summary: Append a corrected-text revision (owned or assigned editors, Admin/Op)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [content], properties: {content: {type: string}}}}}
      responses:
        "201": {description: Revision appended, content: {application/json: {schema: {$ref: "#/components/schemas/CorrectedText"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
  /source/{sourceId}/version/{versionId}/mark-ready-for-review:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    post:
      summary: Move curation to ready_for_review
      responses:
        "200": {description: Ready for review, content: {application/json: {schema: {$ref: "#/components/schemas/Curation"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /source/{sourceId}/version/{versionId}/reject:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    post:
      summary: Close curation as rejected (Admin/Op; item stays stored in Library)
      responses: {"200": {description: Curation rejected}}
  /source/{sourceId}/version/{versionId}/md-draft:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    post:
      summary: Create or update the Markdown draft (owned or assigned)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [contentMd], properties: {contentMd: {type: string}, suggestedBranchId: {type: string, format: uuid}, expectedVersion: {type: integer}}}}}
      responses:
        "200": {description: Draft saved, content: {application/json: {schema: {$ref: "#/components/schemas/MarkdownDraft"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /source/{sourceId}/version/{versionId}/approve:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    post:
      summary: Approve corrected text / draft for publication (Admin/Op)
      responses: {"200": {description: Approved}}
  /source/{sourceId}/version/{versionId}/publish:
    parameters:
      - {$ref: "#/components/parameters/sourceId"}
      - {$ref: "#/components/parameters/versionId"}
    post:
      summary: Publish the approved draft into the tree (Admin/Op; idempotent; creates promotion provenance)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branchId, verification]
              properties:
                branchId: {type: string, format: uuid}
                nodeId: {type: string, format: uuid, description: Existing node to update; omitted creates a new node}
                verification: {type: string, enum: [unverified, verified]}
                excerptChunkIds: {type: array, items: {type: string, format: uuid}}
      responses:
        "201": {description: Published, content: {application/json: {schema: {$ref: "#/components/schemas/TreeNode"}}}}

  # --- Review ---
  /review/queue:
    get:
      summary: Review queue (Admin/Op)
      parameters: [{name: taskType, in: query, schema: {type: string}}, {name: state, in: query, schema: {type: string}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/ReviewTask"}}}}}
  /review/publish/{reviewId}:
    parameters: [{name: reviewId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Publish-review workbench payload (draft, corrected text, chunks, provenance)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/PublishReview"}}}}

  # --- Knowledge Tree ---
  /tree/search:
    get:
      summary: Full-text search over tree nodes
      parameters: [{name: q, in: query, required: true, schema: {type: string}}, {$ref: "#/components/parameters/page"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/TreeNodeSummary"}}}}}
  /tree/nodes:
    post:
      summary: Create a manual node (Editor; enters no_source)
      requestBody: {$ref: "#/components/requestBodies/NodeWrite"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/TreeNode"}}}}
  /tree/nodes/{nodeId}:
    parameters: [{$ref: "#/components/parameters/nodeId"}]
    get:
      summary: Node detail with links, tags, provenance, verification
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/TreeNode"}}}}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      summary: Edit node (owned or assigned Editor, Admin/Op; optimistic-locked)
      requestBody: {$ref: "#/components/requestBodies/NodeWrite"}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/TreeNode"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /tree/nodes/{nodeId}/archive:
    parameters: [{$ref: "#/components/parameters/nodeId"}]
    post:
      summary: Archive a node (Admin/Op)
      responses: {"200": {description: Archived}}
  /tree/nodes/{nodeId}/merge:
    parameters: [{$ref: "#/components/parameters/nodeId"}]
    post:
      summary: Merge this node into a canonical node (Admin/Op; archives and redirects)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [canonicalNodeId], properties: {canonicalNodeId: {type: string, format: uuid}}}}}
      responses: {"200": {description: Merged}}
  /tree/nodes/{nodeId}/export:
    parameters: [{$ref: "#/components/parameters/nodeId"}]
    post:
      summary: Render node Markdown to docx or pdf (any role; worker job)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [format], properties: {format: {type: string, enum: [docx, pdf]}}}}}
      responses:
        "202": {description: Render job queued, content: {application/json: {schema: {$ref: "#/components/schemas/JobRef"}}}}
  /tree/branches:
    post:
      summary: Create a branch (Editor)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [name], properties: {name: {type: string}, description: {type: string}}}}}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Branch"}}}}
  /tree/branches/{branchId}:
    parameters: [{name: branchId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Edit branch metadata (owned or assigned Editor, Admin/Op)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {name: {type: string}, description: {type: string}, expectedVersion: {type: integer}}}}}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Branch"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}

  # --- Notifications and Comments ---
  /notifications:
    get:
      summary: In-app notification center for the caller
      parameters: [{name: unreadOnly, in: query, schema: {type: boolean}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Notification"}}}}}
  /notifications/{notificationId}/read:
    parameters: [{name: notificationId, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Mark a notification read
      responses: {"204": {description: Marked read}}
  /notifications/preferences:
    get:
      summary: Caller's per-event channel preferences
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/NotificationPreference"}}}}}
    patch:
      summary: Update per-event channel preferences
      requestBody:
        required: true
        content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/NotificationPreference"}}}}
      responses: {"200": {description: Updated}}
  /comments:
    get:
      summary: List comments on an object the caller can see
      parameters:
        - {name: anchorType, in: query, required: true, schema: {type: string, enum: [source, tree_node, deadline]}}
        - {name: anchorId, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Comment"}}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      summary: Comment on an object the caller can see (@Name in the body is resolved server-side and notifies that member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [anchorType, anchorId, body]
              properties:
                anchorType: {type: string, enum: [source, tree_node, deadline]}
                anchorId: {type: string, format: uuid}
                parentCommentId: {type: string, format: uuid}
                body: {type: string}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Comment"}}}}

  # --- Catalog and Circulation ---
  /catalog:
    get:
      summary: Browse the physical catalog (library-space members)
      parameters: [{name: q, in: query, schema: {type: string}, description: Title, author, or item code}, {$ref: "#/components/parameters/page"}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/CatalogItem"}}}}}
    post:
      summary: Add a catalog item (Admin/Op librarian; issues item_code)
      requestBody: {$ref: "#/components/requestBodies/CatalogItemWrite"}
      responses:
        "201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/CatalogItem"}}}}
  /catalog/import:
    post:
      summary: Bulk-load the catalog from a spreadsheet via the Sheets bridge (Admin/Op)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [sheetId, columnMapping], properties: {sheetId: {type: string}, columnMapping: {type: object}, spaceId: {type: string, format: uuid}}}}}
      responses:
        "202": {description: Import job queued, content: {application/json: {schema: {$ref: "#/components/schemas/JobRef"}}}}
  /catalog/{itemId}:
    parameters: [{$ref: "#/components/parameters/itemId"}]
    get:
      summary: Catalog item detail including linked digitized source and active loan
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/CatalogItem"}}}}
    patch:
      summary: Edit item, set lost/repair, or link a digitized source (Admin/Op)
      requestBody: {$ref: "#/components/requestBodies/CatalogItemWrite"}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/CatalogItem"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /catalog/{itemId}/loan/request:
    parameters: [{$ref: "#/components/parameters/itemId"}]
    post:
      summary: Request to borrow (library-space member)
      responses:
        "201": {description: Ticket created, content: {application/json: {schema: {$ref: "#/components/schemas/LoanTicket"}}}}
        "409": {description: Item already has an active loan, content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}}
  /catalog/loan/{ticketId}/approve:
    parameters: [{$ref: "#/components/parameters/ticketId"}]
    post:
      summary: Approve a loan request (librarian)
      responses: {"200": {description: Approved, content: {application/json: {schema: {$ref: "#/components/schemas/LoanTicket"}}}}}
  /catalog/loan/{ticketId}/decline:
    parameters: [{$ref: "#/components/parameters/ticketId"}]
    post:
      summary: Decline a loan request (librarian)
      responses: {"200": {description: Declined}}
  /catalog/loan/{ticketId}/borrow:
    parameters: [{$ref: "#/components/parameters/ticketId"}]
    post:
      summary: Mark handed over and set due date (librarian)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [dueAt], properties: {dueAt: {type: string, format: date-time}}}}}
      responses: {"200": {description: Borrowed, content: {application/json: {schema: {$ref: "#/components/schemas/LoanTicket"}}}}}
  /catalog/loan/{ticketId}/return:
    parameters: [{$ref: "#/components/parameters/ticketId"}]
    post:
      summary: Mark returned; item goes back to available (librarian)
      responses: {"200": {description: Returned}}

  # --- Board and Operations ---
  /board:
    get:
      summary: Operational board (Editor, Admin/Op)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Task"}}}}}
  /tasks:
    post:
      summary: Create a task
      requestBody: {$ref: "#/components/requestBodies/TaskWrite"}
      responses: {"201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}}
  /tasks/{taskId}:
    parameters: [{name: taskId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Update a task (owned or assigned for Editors)
      requestBody: {$ref: "#/components/requestBodies/TaskWrite"}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Task"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /achievements:
    post:
      summary: Log an achievement
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [title], properties: {title: {type: string}, branchId: {type: string, format: uuid}, achievedAt: {type: string, format: date-time}}}}}
      responses: {"201": {description: Created}}
  /deadlines:
    get:
      summary: Deadlines across the caller's projects
      parameters: [{name: spaceId, in: query, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/Deadline"}}}}}
    post:
      summary: Create a deadline (project members)
      requestBody: {$ref: "#/components/requestBodies/DeadlineWrite"}
      responses: {"201": {description: Created, content: {application/json: {schema: {$ref: "#/components/schemas/Deadline"}}}}}
  /deadlines/{deadlineId}:
    parameters: [{name: deadlineId, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Edit a deadline (project members)
      requestBody: {$ref: "#/components/requestBodies/DeadlineWrite"}
      responses:
        "200": {description: Updated, content: {application/json: {schema: {$ref: "#/components/schemas/Deadline"}}}}
        "409": {$ref: "#/components/responses/VersionConflict"}
  /admin/health:
    get:
      summary: System health, job counters, backup status, overdue loans (Admin/Op)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/HealthReport"}}}}
  /export/tree:
    post:
      summary: Trigger one-way tree export to the content repo (Admin/Op; idempotent)
      responses:
        "202": {description: Export job queued, content: {application/json: {schema: {$ref: "#/components/schemas/JobRef"}}}}

  /jobs/{jobId}:
    parameters: [{name: jobId, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Job status for render/export jobs (added 2026-07-20; export_jobs ids resolve for Admin/Op only)
      responses:
        "200": {description: OK, content: {application/json: {schema: {$ref: "#/components/schemas/JobRef"}}}}
        "404": {$ref: "#/components/responses/NotFound"}

  # --- Google Bridge ---
  /bridge/drive/import:
    post:
      summary: Import a Drive folder into a space (Admin/Op; idempotent by Drive file id)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [driveFolderId, spaceId], properties: {driveFolderId: {type: string}, spaceId: {type: string, format: uuid}}}}}
      responses:
        "202": {description: Import job queued, content: {application/json: {schema: {$ref: "#/components/schemas/JobRef"}}}}
  /bridge/sheet/import:
    post:
      summary: Import a Sheet into catalog or metrics (Admin/Op)
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [sheetId, target], properties: {sheetId: {type: string}, target: {type: string, enum: [catalog, metrics]}, columnMapping: {type: object}}}}}
      responses:
        "202": {description: Import job queued, content: {application/json: {schema: {$ref: "#/components/schemas/JobRef"}}}}
  /bridge/status:
    get:
      summary: Status and last reports of all configured bridges (Admin/Op)
      responses:
        "200": {description: OK, content: {application/json: {schema: {type: array, items: {$ref: "#/components/schemas/BridgeImport"}}}}}
  /calendar/{token}.ics:
    servers: [{url: /}]
    get:
      summary: Outbound ICS deadline feed (token-authenticated, no session)
      security: []
      parameters: [{name: token, in: path, required: true, schema: {type: string}}]
      responses:
        "200": {description: ICS feed, content: {text/calendar: {schema: {type: string}}}}
        "404": {description: Unknown or revoked token}

components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: session}
  parameters:
    spaceId: {name: spaceId, in: path, required: true, schema: {type: string, format: uuid}}
    sourceId: {name: sourceId, in: path, required: true, schema: {type: string, format: uuid}}
    versionId: {name: versionId, in: path, required: true, schema: {type: string, format: uuid}}
    requestId: {name: requestId, in: path, required: true, schema: {type: string, format: uuid}}
    nodeId: {name: nodeId, in: path, required: true, schema: {type: string, format: uuid}}
    itemId: {name: itemId, in: path, required: true, schema: {type: string, format: uuid}}
    ticketId: {name: ticketId, in: path, required: true, schema: {type: string, format: uuid}}
    page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
  responses:
    Unauthorized:
      description: No valid session
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: Role or scope check failed (audited as outcome=denied)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: Not found, or outside the caller's visibility scope
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    VersionConflict:
      description: Optimistic-lock failure; the save targeted a stale version and was rejected, not merged
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
  requestBodies:
    SpaceCreate:
      required: true
      content: {application/json: {schema: {type: object, required: [name, type], properties: {name: {type: string}, type: {type: string, enum: [team, personal]}}}}}
    SpaceUpdate:
      required: true
      content: {application/json: {schema: {type: object, properties: {name: {type: string}, expectedVersion: {type: integer}}}}}
    NodeWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              branchId: {type: string, format: uuid}
              title: {type: string}
              contentMd: {type: string}
              tags: {type: array, items: {type: string}}
              links: {type: array, items: {type: object, properties: {toNodeId: {type: string, format: uuid}, linkType: {type: string}}}}
              publish: {type: boolean, description: Quartz flag; settable only by Admin/Op on verified nodes}
              expectedVersion: {type: integer}
    CatalogItemWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: {type: string}
              author: {type: string}
              location: {type: string}
              status: {type: string, enum: [available, lost, repair]}
              linkedSourceId: {type: string, format: uuid}
              expectedVersion: {type: integer}
    TaskWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              title: {type: string}
              state: {type: string, enum: [todo, doing, done, archived]}
              assigneeId: {type: string, format: uuid}
              targetType: {type: string}
              targetId: {type: string, format: uuid}
              expectedVersion: {type: integer}
    DeadlineWrite:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              spaceId: {type: string, format: uuid}
              title: {type: string}
              type: {type: string, enum: [conference, funding, report, milestone]}
              dueAt: {type: string, format: date-time}
              reminderOffsets: {type: array, items: {type: string}, description: "Postgres interval strings before dueAt (e.g. '7 days', '1 day')"}
              links: {type: array, items: {type: object, properties: {targetType: {type: string}, targetId: {type: string, format: uuid}}}}
              expectedVersion: {type: integer}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string, description: User-facing, localized (vi default)}
        details: {type: object}
    Session:
      type: object
      properties:
        userId: {type: string, format: uuid}
        displayName: {type: string}
        role: {type: string, enum: [user, editor, admin_op]}
        spaceIds: {type: array, items: {type: string, format: uuid}}
        locale: {type: string}
    Space:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        type: {type: string, enum: [team, personal]}
        memberCount: {type: integer}
        version: {type: integer}
    Source:
      type: object
      properties:
        id: {type: string, format: uuid}
        spaceId: {type: string, format: uuid}
        title: {type: string}
        trustStatus: {type: string, enum: [unknown, candidate, trusted, rejected, archived]}
        submittedBy: {type: string, format: uuid}
        assignedTo: {type: string, format: uuid}
        currentVersion: {$ref: "#/components/schemas/SourceVersion"}
        version: {type: integer}
    SourceVersion:
      type: object
      properties:
        id: {type: string, format: uuid}
        sourceId: {type: string, format: uuid}
        seq: {type: integer}
        originalFilename: {type: string}
        mimeType: {type: string}
        sizeBytes: {type: integer}
        storageState: {type: string, enum: [uploaded, stored, quarantined, archived]}
        extractionStatus: {type: string, enum: [pending, processed, unprocessable]}
        storedAt: {type: string, format: date-time}
        chunkCount: {type: integer}
    LibraryItem:
      type: object
      properties:
        sourceId: {type: string, format: uuid}
        spaceId: {type: string, format: uuid}
        title: {type: string}
        mimeType: {type: string}
        storedAt: {type: string, format: date-time}
        extractionStatus: {type: string}
        snippet: {type: string, description: Full-text match context when q matched extracted text}
    IntakeItem:
      type: object
      properties:
        submissionId: {type: string, format: uuid}
        itemType: {type: string, enum: [source, branch_gap_request]}
        title: {type: string}
        state: {type: string}
        submittedBy: {type: string, format: uuid}
        lastUpdatedAt: {type: string, format: date-time}
        nextAction: {type: string}
    GapRequest:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        state: {type: string, enum: [submitted, triaged, converted_to_branch, rejected, archived]}
        submittedBy: {type: string, format: uuid}
        triagedBy: {type: string, format: uuid}
        version: {type: integer}
    Curation:
      type: object
      properties:
        id: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        state: {type: string, enum: [under_correction, ready_for_review, promoted, rejected]}
        assignedTo: {type: string, format: uuid}
        version: {type: integer}
    CorrectedText:
      type: object
      properties:
        id: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        seq: {type: integer}
        content: {type: string}
        editedBy: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    MarkdownDraft:
      type: object
      properties:
        id: {type: string, format: uuid}
        sourceVersionId: {type: string, format: uuid}
        contentMd: {type: string}
        suggestedBranchId: {type: string, format: uuid}
        version: {type: integer}
    ReviewTask:
      type: object
      properties:
        id: {type: string, format: uuid}
        taskType: {type: string, enum: [correction, gap_triage, publish, merge, archive, operational]}
        targetType: {type: string}
        targetId: {type: string, format: uuid}
        state: {type: string, enum: [queued, assigned, in_review, changes_requested, approved, rejected]}
        assignedTo: {type: string, format: uuid}
        version: {type: integer}
    PublishReview:
      type: object
      properties:
        reviewTask: {$ref: "#/components/schemas/ReviewTask"}
        source: {$ref: "#/components/schemas/Source"}
        sourceVersion: {$ref: "#/components/schemas/SourceVersion"}
        correctedText: {$ref: "#/components/schemas/CorrectedText"}
        draft: {$ref: "#/components/schemas/MarkdownDraft"}
    TreeNodeSummary:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        slug: {type: string}
        branchId: {type: string, format: uuid}
        verification: {type: string, enum: [no_source, unverified, verified, archived]}
        snippet: {type: string}
    TreeNode:
      allOf:
        - {$ref: "#/components/schemas/TreeNodeSummary"}
        - type: object
          properties:
            contentMd: {type: string}
            publish: {type: boolean}
            canonicalNodeId: {type: string, format: uuid, description: Redirect target when merged}
            tags: {type: array, items: {type: string}}
            links: {type: array, items: {type: object, properties: {toNodeId: {type: string, format: uuid}, linkType: {type: string}}}}
            provenance: {type: array, items: {type: object, properties: {sourceVersionId: {type: string, format: uuid}, approvedBy: {type: string, format: uuid}, createdAt: {type: string, format: date-time}}}}
            version: {type: integer}
    Branch:
      type: object
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        version: {type: integer}
    Notification:
      type: object
      properties:
        id: {type: string, format: uuid}
        eventType: {type: string}
        payload: {type: object}
        readAt: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    NotificationPreference:
      type: object
      properties:
        eventType: {type: string}
        channels: {type: array, items: {type: string, enum: [in_app, email, zalo]}}
    Comment:
      type: object
      properties:
        id: {type: string, format: uuid}
        anchorType: {type: string, enum: [source, tree_node, deadline]}
        anchorId: {type: string, format: uuid}
        parentCommentId: {type: string, format: uuid}
        authorId: {type: string, format: uuid}
        body: {type: string}
        mentions: {type: array, items: {type: string, format: uuid}}
        createdAt: {type: string, format: date-time}
    CatalogItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        itemCode: {type: string}
        title: {type: string}
        author: {type: string}
        coverPhotoUrl: {type: string}
        location: {type: string}
        status: {type: string, enum: [available, borrowed, lost, repair]}
        spaceId: {type: string, format: uuid}
        linkedSourceId: {type: string, format: uuid}
        activeLoan: {$ref: "#/components/schemas/LoanTicket"}
        version: {type: integer}
    LoanTicket:
      type: object
      properties:
        id: {type: string, format: uuid}
        itemId: {type: string, format: uuid}
        borrowerId: {type: string, format: uuid}
        state: {type: string, enum: [requested, approved, declined, borrowed, overdue, returned]}
        requestedAt: {type: string, format: date-time}
        dueAt: {type: string, format: date-time}
        returnedAt: {type: string, format: date-time}
        handledBy: {type: string, format: uuid}
        version: {type: integer}
    Task:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        state: {type: string, enum: [todo, doing, done, archived]}
        assignedTo: {type: string, format: uuid}
        targetType: {type: string}
        targetId: {type: string, format: uuid}
        version: {type: integer}
    Deadline:
      type: object
      properties:
        id: {type: string, format: uuid}
        spaceId: {type: string, format: uuid}
        title: {type: string}
        type: {type: string, enum: [conference, funding, report, milestone]}
        dueAt: {type: string, format: date-time}
        reminderOffsets: {type: array, items: {type: string}}
        links: {type: array, items: {type: object, properties: {targetType: {type: string}, targetId: {type: string, format: uuid}}}}
        version: {type: integer}
    BridgeImport:
      type: object
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [drive, sheet_catalog, sheet_metrics, forms]}
        state: {type: string, enum: [configured, running, succeeded, failed]}
        lastRunAt: {type: string, format: date-time}
        lastReport: {type: object}
    JobRef:
      type: object
      properties:
        jobId: {type: string, format: uuid}
        jobType: {type: string}
        state: {type: string, enum: [queued, running, succeeded, failed, dead]}
        result:
          type: object
          description: Present on succeeded render jobs
          properties:
            downloadUrl: {type: string}
            converterWarnings: {type: array, items: {type: string}}
    HealthReport:
      type: object
      properties:
        jobCounts: {type: object, description: Success and failure counts by job type}
        ocrFailureRate: {type: number}
        publishSuccessRate: {type: number}
        exportValidationFailures: {type: integer}
        queueLatencySeconds: {type: number}
        backlogOver7Days: {type: integer}
        lastBackupAt: {type: string, format: date-time}
        backupStatus: {type: string}
        overdueLoanCount: {type: integer}
        degradedComponents: {type: array, items: {type: string}}
