name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wisdomtree
          POSTGRES_PASSWORD: wisdomtree
          POSTGRES_DB: wisdomtree
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wisdomtree -d wisdomtree"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://wisdomtree:wisdomtree@localhost:5432/wisdomtree
      ENABLE_DEV_LOGIN: '1'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Run fast checks
        run: npm test
      - name: Run DB migrations
        run: npm run db:migrate
      - name: Seed DB (destructive for CI demo)
        run: ALLOW_DESTRUCTIVE_SEED=1 npm run db:seed
      - name: Run integration tests
        run: npm run test:integration
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
